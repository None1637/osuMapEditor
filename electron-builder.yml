appId: com.osumapeditor.app
productName: osu! Map Editor
directories:
  output: release
files:
  - dist/**
  - electron/**
  - server/**
  - package.json
win:
  target: portable
asar: true
# v599: 自包含 .NET + lazer 同源 BASS 原生库, 用户机器无需安装 .NET
extraResources:
  - from: native/BassAudioSidecar/publish
    to: native/BassAudioSidecar
